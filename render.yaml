services:
  - type: web
    name: oppscout
    runtime: python
    plan: free
    healthCheckPath: /healthz/
    # Seed data is loaded on every deploy (idempotent). Once you start editing
    # listings in the admin, remove load_opportunities from this line so
    # deploys stop overwriting your edits. The superuser step is skipped when
    # the DJANGO_SUPERUSER_* variables are not set.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input &&
      python manage.py load_opportunities &&
      (python manage.py createsuperuser --no-input || true)
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
