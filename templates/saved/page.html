{% extends "base.html" %}
{% block title %}Saved opportunities · OppScout AI{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Saved opportunities</h1>
  <p>Your saved list is kept in this browser only. Clearing your browser data removes it, and it does not follow you to another device.</p>
</div>
<form id="saved-form" method="post" action="{% url 'opportunities:saved_list' %}"
      hx-post="{% url 'opportunities:saved_list' %}" hx-trigger="load" hx-target="#saved-list" hidden>
  {% csrf_token %}
</form>
<div id="saved-list" aria-live="polite">
  <noscript><p class="notice notice-warn">{% include "partials/icon.html" with name="alert" %}<span>Saved opportunities need JavaScript.</span></p></noscript>
</div>
{% endblock %}
